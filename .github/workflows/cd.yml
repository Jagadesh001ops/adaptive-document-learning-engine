name: CD

# Triggers after CI passes on main, or manually via workflow_dispatch.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Prevents two deployments running at the same time.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Only run if CI succeeded ─────────────────────────────────────────────
  guard:
    name: Guard — CI must pass
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed. Proceeding with CD."

  # ── 2. Smoke tests against service containers ────────────────────────────────
  smoke:
    name: Smoke tests
    needs: guard
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_DB: smokedb
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci_user@127.0.0.1:5432/smokedb
      REDIS_URL: redis://127.0.0.1:6379
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: ci_user
      PGDATABASE: smokedb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (skip heavy ML packages)
        run: |
          grep -v "sentence-transformers" requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v --tb=short

  # ── 3. Human approval gate ───────────────────────────────────────────────────
  #
  # Create a GitHub Environment named "production" in:
  #   Settings → Environments → New environment → Add required reviewers
  # Only approved reviewers can unblock this step.
  gate:
    name: Await production approval
    needs: smoke
    runs-on: ubuntu-latest
    environment: production   # <── approval gate lives here

    steps:
      - name: Deployment approved
        run: echo "Deployment to production approved by ${{ github.actor }}."

  # ── 4. Deploy to Render ───────────────────────────────────────────────────────
  #
  # Required secret (repo Settings → Secrets → Actions):
  #   RENDER_DEPLOY_HOOK_URL — deploy hook URL from Render dashboard
  #                            (service → Settings → Deploy Hook → Copy)
  #
  # Render pulls from GitHub and builds using the Dockerfile automatically.
  # Set environment variables (DATABASE_URL, REDIS_URL, GROQ_API_KEY, etc.)
  # directly in the Render service dashboard — Environment tab.
  # Rollback: Render dashboard → service → Events → redeploy any past deploy.
  deploy:
    name: Deploy to Render
    needs: gate
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        # URL and API key passed via env — never interpolated into shell commands.
        # Skips gracefully when RENDER_DEPLOY_HOOK_URL is not set.
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping deploy"
            exit 0
          fi

          DEPLOY_ID=$(curl -f -s -X POST "$HOOK_URL" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          echo "Deploy triggered — ID: ${DEPLOY_ID:-unknown}"
          echo "RENDER_DEPLOY_ID=${DEPLOY_ID}" >> "$GITHUB_ENV"

          # Poll for build completion if API key and service ID are available.
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ] || [ -z "$DEPLOY_ID" ]; then
            echo "RENDER_API_KEY / RENDER_SERVICE_ID not set — skipping status poll"
            exit 0
          fi

          for i in $(seq 1 40); do
            STATUS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('deploy',{}).get('status',''))" 2>/dev/null || echo "unknown")
            echo "[$i/40] deploy status: $STATUS"
            [ "$STATUS" = "live" ] && break
            [ "$STATUS" = "build_failed" ] && echo "Render build failed" && exit 1
            [ "$STATUS" = "deactivated" ] && echo "Render deploy deactivated" && exit 1
            sleep 15
          done
          [ "$STATUS" = "live" ] || echo "Warning: deploy did not reach 'live' within 10 min — check Render dashboard"

      - name: Record deployment
        if: success()
        run: |
          echo "Deploy triggered on Render — commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Render deploy ID: ${{ env.RENDER_DEPLOY_ID }}" >> "$GITHUB_STEP_SUMMARY"
